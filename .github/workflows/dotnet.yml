name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory coverage

    - name: ReportGenerator
      uses: danielpalme/ReportGenerator-GitHub-Action@5
      with:
        reports: 'coverage/**/coverage.cobertura.xml'
        targetdir: 'coverage-report'
        reporttypes: 'MarkdownSummaryGithub;Cobertura'

    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v3
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: coverage-report/SummaryGithub.md

    - name: Write to Job Summary
      run: cat coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

    - name: Upload coverage report artifact
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: coverage-report/Cobertura.xml
        retention-days: 5

    - name: Build Release
      run: dotnet build src/AeroNext.QaHarness -c Release --no-restore

    - name: Create output directory
      run: mkdir -p ./sweep-output

    - parallel:
      - name: Sweep 1
        run: dotnet run --no-build --project src/AeroNext.QaHarness -c Release -- --games 4 --seed 1 --difficulty hard > sweep-output/deterministic-sweep-1.log

      - name: Sweep 2
        run: dotnet run --no-build --project src/AeroNext.QaHarness -c Release -- --games 4 --seed 2 --difficulty hard > sweep-output/deterministic-sweep-2.log

    - name: Compare Sweeps with diff
      id: compare-sweeps
      run: |
        diff sweep-output/deterministic-sweep-1.log sweep-output/deterministic-sweep-2.log

    - name: Upload Sweep On Failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: sweep-output
        path: sweep-output/
        retention-days: 5
